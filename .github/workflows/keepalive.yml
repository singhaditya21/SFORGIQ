name: Salesforce org keep-alive

# Agentforce Developer Edition orgs are deleted after ~45 days without a login.
# This logs in weekly so that clock never runs out, and writes a heartbeat commit
# so GitHub's own "disable scheduled workflows after 60 days of no repo activity"
# clock never trips either. Self-sustaining once the secret is set.
#
# It deliberately does NOT use `sf org login sfdx-url`: this org's refresh token
# contains a ":", and the force://<clientId>:<clientSecret>:<refreshToken>@<host>
# format is split on colons, so the CLI rejects the URL as malformed. We parse the
# secret ourselves (the fixed "force://PlatformCLI::" prefix and the last "@" make
# that unambiguous) and do the OAuth refresh directly, which also means no CLI to
# install and a job that finishes in seconds.
#
# One-time setup: bash scripts/setup-keepalive.sh

on:
  schedule:
    - cron: '0 6 * * 1'      # every Monday 06:00 UTC — far under both limits
  workflow_dispatch:

permissions:
  contents: write            # to push the heartbeat commit

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Salesforce (resets the 45-day org clock)
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SFDX_AUTH_URL:-}" ]; then
            echo "::error::SFDX_AUTH_URL secret is not set. Run scripts/setup-keepalive.sh once."
            exit 1
          fi

          rest="${SFDX_AUTH_URL#force://}"
          host="${rest##*@}"          # after the LAST @ — the token has no @
          creds="${rest%@*}"
          token="${creds#*::}"        # after the FIRST :: — keeps colons in the token
          echo "::add-mask::$token"   # derived from a secret, so mask it explicitly

          if [ -z "$host" ] || [ -z "$token" ]; then
            echo "::error::Could not parse SFDX_AUTH_URL. Re-run scripts/setup-keepalive.sh."
            exit 1
          fi

          # Exchange the refresh token for an access token. This request is itself
          # the "login" Salesforce records, which is what resets the inactivity clock.
          resp=$(curl -sS -X POST "https://$host/services/oauth2/token" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "client_id=PlatformCLI" \
            --data-urlencode "refresh_token=$token")
          access=$(printf '%s' "$resp" | jq -r '.access_token // empty')
          if [ -z "$access" ]; then
            # Surface Salesforce's own error code — never the token. Without this
            # a failure here is undebuggable from the logs.
            err=$(printf '%s' "$resp" | jq -r '.error // "non-JSON response"')
            desc=$(printf '%s' "$resp" | jq -r '.error_description // ""')
            echo "::error::OAuth refresh rejected: $err $desc"
            exit 1
          fi
          echo "::add-mask::$access"

          # Touch the org so the session is genuinely used, and prove it worked.
          name=$(curl -sS -H "Authorization: Bearer $access" \
            "https://$host/services/data/v60.0/query?q=SELECT+Name+FROM+Organization+LIMIT+1" \
            | jq -r '.records[0].Name // empty')
          if [ -z "$name" ]; then
            echo "::error::Authenticated but the query failed."
            exit 1
          fi
          echo "Keep-alive login recorded for org: $name"

      - name: Heartbeat commit (keeps the scheduler alive)
        run: |
          mkdir -p ops
          date -u +%FT%TZ > ops/last-keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/last-keepalive.txt
          git commit -m "chore: keep-alive heartbeat [skip ci]" || exit 0
          git push
